[project]
name = "mypr-mcp"
version = "0.4.0"
description = "A persistent, workspace-shared Python environment for MCP agents"
requires-python = ">=3.14"
dependencies = ["mcp>=2.2,<3", "ipykernel>=7.3,<8", "jupyter-client>=8.10,<9", "pyyaml>=6,<7", "tomlkit>=0.15,<1"]

[project.scripts]
mypr-mcp = "mypr_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
